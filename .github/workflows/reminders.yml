name: Daily reminders

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Uji coba: kirim sekarang tanpa menunggu jam pengingat'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install firebase-admin
        run: npm install --no-save --no-package-lock firebase-admin@12
      - name: Send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: node scripts/send-reminders.mjs
